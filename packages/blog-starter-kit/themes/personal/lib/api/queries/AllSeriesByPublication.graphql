query AllSeriesByPublication($host: String!, $first: Int!, $after: String) {
	publication(host: $host) {
		...Publication
		seriesList(first: $first, after: $after) {
			edges {
				node {
					id
					name
					slug
					description {
						html
						text
					}
					coverImage
				}
			}
			pageInfo {
				...PageInfo
			}
		}
	}
}
